name: Publishing

on:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read
  id-token: write # required for npm trusted publishing (OIDC)

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # npm >= 11.5.1 is required for trusted publishing
          registry-url: 'https://registry.npmjs.org'
      - run: npm -v
      - run: node -v
      - run: npm i
      - run: npm run build
      - name: Check version is not yet published
        id: version
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION already published, skipping"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Release
        if: github.ref_name == 'main' && steps.version.outputs.publish == 'true'
        run: npm publish
      - name: Next
        if: github.ref_name == 'develop' && steps.version.outputs.publish == 'true'
        run: npm publish --tag next
